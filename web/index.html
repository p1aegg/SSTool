<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SSTool by p1ae: a curated suite of Windows forensic tools including OrbDiff, Spokwn, NirSoft, and more.">
<title>SSTool — p1ae</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0d0d0d;color:#e5e5e5;overflow:hidden;-webkit-font-smoothing:antialiased}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#app{width:100%;height:100%;background:#0d0d0d;font-family:'Segoe UI',system-ui,sans-serif;color:#e5e5e5;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;animation:fadeIn 1s ease-out}

.drag-handle{display:flex;align-items:center;justify-content:space-between;height:28px;padding:0 10px;background:#111;border-bottom:1px solid #1a1a1a;font-size:12px;cursor:default;user-select:none}
.drag-handle .drag-title{color:#a3a3a3;font-size:11px;font-weight:500;letter-spacing:0.3px}
.drag-handle .drag-title span{color:#ddaaff;font-weight:600}
.drag-handle .win-btns{display:flex;align-items:center;gap:10px}
.drag-handle svg{cursor:pointer;opacity:0.5;transition:opacity 0.15s}
.drag-handle svg:hover{opacity:1}

.tab-bar{display:flex;align-items:center;gap:4px;padding:8px 8px 0;border-bottom:1px solid #1a1a1a;background:#0d0d0d;overflow-x:auto}
.tab-bar::-webkit-scrollbar{height:3px}
.tab-bar::-webkit-scrollbar-track{background:transparent}
.tab-bar::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
.tab-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:12px;white-space:nowrap;border:none;background:transparent;color:#a3a3a3;cursor:pointer;border-bottom:2px solid transparent;transition:color 0.15s,border-color 0.15s;font-family:inherit}
.tab-btn:hover{color:#e5e5e5}
.tab-btn.active{color:#ddaaff;border-bottom-color:#ddaaff}
.tab-btn svg{flex-shrink:0}

.content-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.content-header h1{font-size:13px;font-weight:400;color:#d4d4d4}
.content-header h1 span{color:#a3a3a3}
.btn-dl-all{font-size:12px;padding:6px 14px;border:1px solid rgba(221,170,255,0.4);border-radius:4px;background:transparent;color:#ddaaff;cursor:pointer;transition:background 0.15s;box-shadow:0 0 8px rgba(221,170,255,0.15);font-family:inherit}
.btn-dl-all:hover{background:rgba(221,170,255,0.12)}

.tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 20px 48px;min-height:0;flex:1;overflow-y:auto;align-content:start;scrollbar-width:thin;scrollbar-color:#4a2a66 transparent}
.tool-grid::-webkit-scrollbar{width:10px}
.tool-grid::-webkit-scrollbar-track{background:transparent}
.tool-grid::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#8a4ec2,#5c2f8a);border-radius:6px;border:2px solid #0d0d0d;background-clip:padding-box}
.tool-grid::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#ddaaff,#b84aff);background-clip:padding-box}
.tool-card{position:relative;border-radius:6px;padding:16px;height:110px;border:1px solid #2a2a2a;cursor:pointer;background:rgba(18,18,18,0.88);transition:background 0.8s ease-out,border-color 0.8s ease-out;display:flex;flex-direction:column}
.tool-card:hover{background:rgba(20,10,30,0.9);border-color:rgba(184,74,255,0.6);box-shadow:0 0 16px rgba(184,74,255,0.2);transition-duration:0.1s}
.tool-card .name{font-size:13px;font-weight:500;color:#f5f5f5;margin-bottom:8px}
.tool-card .desc{font-size:12px;color:#a3a3a3;line-height:1.4;flex:1}
.tool-card .progress-wrap{position:absolute;bottom:1px;left:1px;right:1px;height:3px;background:#1a1a1a;border-radius:0 0 5px 5px;overflow:hidden}
.tool-card .progress-bar{height:100%;background:linear-gradient(90deg,#ddaaff,#b84aff);transition:width 0.3s;width:0}
.tool-card .progress-bar.indeterminate{width:35%!important;animation:indeterminate 1.3s ease-in-out infinite;background:linear-gradient(90deg,#ddaaff,#b84aff,#ddaaff);background-size:200% 100%}
.tool-card .cooldown-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#a3a3a3;backdrop-filter:blur(2px)}
.tool-card .dl-indicator{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#2a2a2a}
.tool-card .dl-indicator.downloaded{background:#22c55e}
.tool-card .dl-indicator.downloading{background:#ddaaff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}




@keyframes indeterminate{0%{transform:translateX(-100%)}50%{transform:translateX(200%)}100%{transform:translateX(400%)}}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(24px)}}
#toast-stack{position:fixed;right:14px;bottom:14px;z-index:90;display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none;max-width:280px}
.dl-toast{pointer-events:auto;background:#111114;border:1px solid #232328;border-left:3px solid #d99a3f;border-radius:4px;padding:7px 10px;font-size:11.5px;box-shadow:0 6px 20px rgba(0,0,0,0.45);animation:toastIn 0.18s ease-out;overflow:hidden}
.dl-toast.closing{animation:toastOut 0.18s ease-in forwards}
.dl-toast .dl-toast-text{color:#d4d4d4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-toast .dl-toast-tag{font-weight:600;margin-right:2px}
.dl-toast.downloading .dl-toast-tag{color:#e0a83f}
.dl-toast.downloading .dl-toast-bar{margin-top:6px;height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden}
.dl-toast.downloading .dl-toast-fill{height:100%;background:linear-gradient(90deg,#e0a83f,#d97b3f);border-radius:2px;transition:width 0.25s;width:0}
.dl-toast.downloading .dl-toast-fill.indeterminate{width:30%!important;animation:indeterminate 1.3s ease-in-out infinite;background:linear-gradient(90deg,#e0a83f,#d97b3f,#e0a83f);background-size:200% 100%}
.dl-toast.success{border-left-color:#22c55e}
.dl-toast.success .dl-toast-tag{color:#22c55e}
.dl-toast.error{border-left-color:#ef4444}
.dl-toast.error .dl-toast-tag{color:#ef4444}

#confirm-overlay{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.6)}
#confirm-overlay.show{display:flex}
.confirm-dialog{background:#0d0d14;border:1px solid #1a1a24;border-radius:10px;padding:24px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.confirm-dialog h3{font-size:14px;color:#e5e5e5;margin-bottom:8px}
.confirm-dialog p{font-size:13px;color:#a3a3a3;margin-bottom:16px;line-height:1.5}
.confirm-buttons{display:flex;justify-content:flex-end;gap:10px}
.confirm-buttons button{font-size:12px;padding:8px 16px;border-radius:4px;border:none;cursor:pointer;transition:all 0.15s;font-family:inherit}
.confirm-buttons .btn-no{background:#1a1a24;color:#a3a3a3}
.confirm-buttons .btn-no:hover{background:#2a2a3a}
.confirm-buttons .btn-yes{background:linear-gradient(135deg,#ddaaff,#b84aff);color:#fff}

.empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;color:#525252;font-size:13px;gap:8px}
.empty-state svg{opacity:0.4;margin-bottom:4px}

@media(max-width:800px){.tool-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.tool-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.tool-grid{grid-template-columns:1fr}}
</style>
</head>

let activeTab = 'orbdiff';
let cooldowns = {};
let batchDownloadActive = false;
let batchPending = new Set();
let pendingLaunch = null;

let mockInterval = null;
const downloadedCache = {};

document.addEventListener('DOMContentLoaded', () => {
  document.addEventListener('selectstart', (e) => e.preventDefault());

  const handle = document.getElementById('dragHandle');
  if (handle) {
    handle.addEventListener('mousedown', (e) => {
      if (e.target.tagName !== 'svg' && e.target.tagName !== 'line') {
        tryBridge('startWindowDrag');
      }
    });
  }
});

function renderTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  tabs.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (t.key === activeTab ? ' active' : '');
    btn.innerHTML = t.icon + (t.label ? '<span>' + t.label + '</span>' : '');
    btn.onclick = () => switchTab(t.key);
    bar.appendChild(btn);
  });
}

function switchTab(key) {
  activeTab = key;
  renderTabs();
  renderTools();
  document.getElementById('btn-dl-all').style.display = (activeTab === 'scripts' ? 'none' : '');
  const t = tabs.find(t => t.key === key);
  if (t && t.header) document.getElementById('section-heading').innerHTML = t.header;
}

function renderTools() {
  const grid = document.getElementById('toolGrid');
  grid.innerHTML = '';

  let items;
  if (activeTab === 'scripts') {
    items = scripts.map(s => ({ ...s, isScript: true })).sort((a, b) => a.name.localeCompare(b.name));
  } else {
    items = tools.filter(t => t.category === activeTab);
    if (activeTab !== 'dependencies') {
      items = items.slice().sort((a, b) => a.name.localeCompare(b.name));
    }
  }

  if (items.length === 0) {
    grid.innerHTML = '<div class="empty-state">' + icons.asterisk + '<span>No tools in this category</span></div>';
    return;
  }

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'tool-card';
    card.dataset.name = item.name || item.name;

    let html = '<div class="name">' + (item.name || item.name) + '</div>';
    html += '<div class="desc">' + (item.desc || '') + '</div>';
    html += '<div class="dl-indicator" id="dl-' + (item.name || item.name) + '"></div>';
    html += '<div class="progress-wrap"><div class="progress-bar" id="prog-' + (item.name || item.name) + '"></div></div>';

    card.innerHTML = html;
    card.onclick = () => handleToolClick(item);
    grid.appendChild(card);

    updateIndicator(item.name || item.name, 'checking');
  });
}

function updateIndicator(name, state) {
  const dot = document.getElementById('dl-' + name);
  if (!dot) return;
  dot.className = 'dl-indicator';
  if (state === 'downloaded') dot.classList.add('downloaded');
  else if (state === 'downloading') dot.classList.add('downloading');
}

function updateProgress(name, percent) {
  const bar = document.getElementById('prog-' + name);
  if (bar) {
    bar.classList.remove('indeterminate');
    bar.style.width = Math.min(percent, 100) + '%';
  }
  updateIndicator(name, 'downloading');
}

function updateProgressIndeterminate(name) {
  const bar = document.getElementById('prog-' + name);
  if (bar) bar.classList.add('indeterminate');
  updateIndicator(name, 'downloading');
}

function handleToolClick(item) {
  if (item._cooldown) return;

  if (item.isScript) {
    tryBridge('openScript', item.cmd);
    return;
  }

  const name = item.name;
  const urls = Array.isArray(item.link) ? item.link : [item.link];

  updateIndicator(name, 'downloading');
  showToast(name);
  tryBridge('downloadTool', name, JSON.stringify(urls), item.category || activeTab);
}

const toastTimers = {};

function toastId(name) {
  return 'toast-' + name.replace(/[^a-zA-Z0-9_-]/g, '_');
}

function showToast(name) {
  if (toastTimers[name]) { clearTimeout(toastTimers[name]); delete toastTimers[name]; }
  const stack = document.getElementById('toast-stack');
  let el = document.getElementById(toastId(name));
  if (!el) {
    el = document.createElement('div');
    el.id = toastId(name);
    stack.appendChild(el);
  }
  el.className = 'dl-toast downloading';
  el.innerHTML =
    '<div class="dl-toast-text"><span class="dl-toast-tag">[0%]</span>Downloading ' + name + '</div>' +
    '<div class="dl-toast-bar"><div class="dl-toast-fill indeterminate"></div></div>';
}

function updateToastProgress(name, percent, label) {
  const el = document.getElementById(toastId(name));
  if (!el) return;
  el.className = 'dl-toast downloading';
  const tag = el.querySelector('.dl-toast-tag');
  const fill = el.querySelector('.dl-toast-fill');
  if (percent !== null) {
    tag.textContent = '[' + Math.min(percent, 100) + '%]';
    fill.classList.remove('indeterminate');
    fill.style.width = Math.min(percent, 100) + '%';
  } else {
    tag.textContent = label ? '[' + label + ']' : '[...]';
    fill.classList.add('indeterminate');
  }
}

function completeToast(name, success) {
  const el = document.getElementById(toastId(name));
  if (!el) return;
  el.className = 'dl-toast ' + (success ? 'success' : 'error');
  el.innerHTML = success
    ? '<div class="dl-toast-text"><span class="dl-toast-tag">[+]</span>' + name + ' saved</div>'
    : '<div class="dl-toast-text"><span class="dl-toast-tag">[-]</span>' + name + ' failed</div>';
  toastTimers[name] = setTimeout(() => {
    el.classList.add('closing');
    setTimeout(() => el.remove(), 200);
    delete toastTimers[name];
  }, 3000);
}

function cancelCurrentDownload() {
  tryBridge('cancelDownload');
}

function showConfirm(name, exePath) {
  const overlay = document.getElementById('confirm-overlay');
  overlay.classList.add('show');
  document.getElementById('confirmTitle').textContent = 'Launch ' + name;
  document.getElementById('confirmBody').textContent =
    'This will run ' + name + ' from the tools folder. Proceed?';
  pendingLaunch = { name, exePath };
}

function cancelLaunch() {
  document.getElementById('confirm-overlay').classList.remove('show');
  pendingLaunch = null;
}

function confirmLaunch() {
  document.getElementById('confirm-overlay').classList.remove('show');
  if (pendingLaunch) {
    tryBridge('launchTool', pendingLaunch.exePath);
    startCooldown(pendingLaunch.name);
    pendingLaunch = null;
  }
}

function startCooldown(name) {
  cooldowns[name] = true;
  const card = document.querySelector('.tool-card[data-name="' + name + '"]');
  if (card) {
    card.style.pointerEvents = 'none';
    card.style.opacity = '0.5';
    const overlay = document.createElement('div');
    overlay.className = 'cooldown-overlay';
    overlay.id = 'cd-' + name;
    let sec = 5;
    overlay.textContent = 'Cooldown ' + sec + 's';
    card.appendChild(overlay);

    const interval = setInterval(() => {
      sec--;
      if (sec <= 0) {
        clearInterval(interval);
        cooldowns[name] = false;
        card.style.pointerEvents = '';
        card.style.opacity = '';
        const el = document.getElementById('cd-' + name);
        if (el) el.remove();
      } else {
        overlay.textContent = 'Cooldown ' + sec + 's';
      }
    }, 1000);
  }
}

function tryBridge(method, ...args) {
  try {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(JSON.stringify({ method, args }));
    }
  } catch(e) {
    console.warn('postMessage failed:', e);
  }
}

window.handleCppMessage = function(jsonStr) {
  try {
    handleMessage(JSON.parse(jsonStr));
  } catch(e) {
    console.warn('handleCppMessage error:', e);
  }
};

function setupMessageListener() {
  try {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', (e) => {
        try {
          const msg = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
          handleMessage(msg);
        } catch(err) { console.warn('Invalid message:', e.data); }
      });
    }
  } catch(e) {}
}

function fmtBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'progress':
      if (msg.name) {
        const val = msg.value || 0;
        const total = msg.totalSize || 0;
        if (total > 0) {
          updateProgress(msg.name, val);
          updateToastProgress(msg.name, val);
        } else if (val === 0) {
          updateProgressIndeterminate(msg.name);
          updateToastProgress(msg.name, null, 'Starting...');
        } else {
          updateProgressIndeterminate(msg.name);
          updateToastProgress(msg.name, null, fmtBytes(val));
        }
      }
      break;
    case 'downloadComplete':
      if (msg.success && msg.name) {
        updateIndicator(msg.name, 'downloaded');
        downloadedCache[msg.name] = true;
        updateProgress(msg.name, 100);
        completeToast(msg.name, true);
        if (msg.exePath && !msg.isZip) {
          if (batchDownloadActive) {
          } else {
            tryBridge('launchTool', msg.exePath);
            startCooldown(msg.name);
          }
        }
      } else {
        updateIndicator(msg.name, '');
        completeToast(msg.name, false);
      }
      if (msg.name) markBatchItemDone(msg.name);
      break;
  }
}

function markBatchItemDone(name) {
  if (!batchDownloadActive) return;
  batchPending.delete(name);
  if (batchPending.size === 0) {
    batchDownloadActive = false;
  }
}

function downloadAllTools() {
  const items = (activeTab === 'scripts' ? scripts : tools.filter(t => t.category === activeTab));
  const toDownload = items.filter(item => !item.isScript);
  if (toDownload.length === 0) return;

  batchDownloadActive = true;
  batchPending = new Set(toDownload.map(item => item.name));

  for (const item of toDownload) {
    handleToolClick(item);
  }
}



setupMessageListener();
